        <script type="text/javascript"> 
        
            var chess = new Chess();
            var chess1 = new Chess();
            var chess2 = new Chess();
            var chess3 = new Chess();
            var board1;  
            var socket;
            var nIndexGames = 0; 
            var nNodo;  
                        
            // Initialize Stockfish.js in a Web Worker
            //var stockfish = new Worker('js/stockfish-nnue-16-no-simd.js'); 
            var stockfish = new Worker('js/stockfish-16.1-lite-single.js');  
            
            $(document).ready(function(){
                
                socket = io();  

                socket.on('SANs', function(msg){
                    console.log('Nodo test: ' + msg.Nodo);
                    nNodo = msg.Nodo;
                    console.log(msg);
                    // Rellenar grid de movimientos SANs
                    FillGrid1(msg.resultSelectSans);
                    socket.emit('LoadGames',{Nodo:msg.Nodo,nIndexGames:nIndexGames});                    
                });  
                
                socket.on('LoadGamesBack', async function (msg) { 
                    nIndexGames = msg.nIndexGames;                   
                    FillGrid2(msg.resultSelectGames);
                });
                
                socket.on('LoadPGNGameBack', async function (msg) { 
                    //console.log(msg);                    
                    LoadPGNGame(msg);
                });
                
                // Posicion inicial
                var config = {position:'start',draggable:true,onDrop:onDrop,onSnapEnd:onSnapEnd};
                board1 = ChessBoard('board1',config);

                var oMove = {
                    NodoPadre:-1,
                    NodoHijo:0,
                    fen:'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',
                    san:'',
                    source:'',
                    target:'',
                    DeepMove:0
                }
                aHistoryTree.push(oMove);

                $('#btFLIP').button();
                $('#btINI').button();
                $('#btPREV').button();
                $('#btNEXT').button();
                $('#btEND').button(); 

                //Navegar por games
                $('#btINIGames').button();
                $('#btPREVGames').button();
                $('#btNEXTGames').button();
                $('#btENDGames').button();
                
                IniGrid1();
                IniGrid2();
                $('.ui-jqgrid-hdiv').hide();
                jQuery("#Grid2").addClass("myclass");
                jQuery("#Grid1").addClass("myclass2");

                $('#btFLIP').on('click',function(){
                    board1.flip();
                });

                $('#btINI').on('click',function(){

                    //stockfish.postMessage('stop');
                    //stockfish.postMessage('ucinewgame');
                    //stockfish.postMessage('isready');

                    board1.position(aHistoryTree[0].fen);
                    chess.reset();
                    SeekFEN(chess.fen());
                    stockfish.postMessage('stop');
                    stockfish.postMessage('position fen ' + chess.fen());
                    stockfish.postMessage('go infinite');
                    nDeepMove = 0;
                    LastEvent = 'btINI';                    
                    DentroVariante = false;
                    nNodoPadre = 0;
                    nNodoHijo = 1; 
                    BufferNodoHijo = nNodoHijo; 
                    LastMove = 'move1';
                    $('#'+BufferClick).css('background','#e8e8e8'); 
                    $('#move'+nNodoPadre).css('background','#f5a742');
                    BufferClick = 'move'+nNodoPadre;                    
                    //stockfish.postMessage('position fen ' + chess.fen());
                    //stockfish.postMessage('go infinite');
                    //stockfish.postMessage('uci');
                });

                $('#btPREV').on('click',function(){
                    btPREV();
                });

                $('#btNEXT').on('click',function(){
                    btNEXT();
                });

                $('#btEND').on('click',function(){
                    btEND();
                });

                $('#btNEXTGames').on('click',function(){
                    btNEXTGames();
                });

                $('#btPREVGames').on('click',function(){
                    btPREVGames();
                });

                $('#btINIGames').on('click',function(){
                    btINIGames();
                });

                $('#btENDGames').on('click',function(){
                    btENDGames();
                });

                // Test Stockfish  
                stockfish.postMessage('setoption name MultiPV value 3');              

                // Handle engine output
                stockfish.addEventListener('message', (e) => {
                    /*if (e.data === 'uciok') {
                        save = true;
                    }*/
                    const response = e.data;
                    console.log('Engine response:', response);

                    // Detect if the engine has stopped
                    if (response.startsWith('bestmove')){
                        console.log('Calculation stopped. Best move:', response.split(' ')[1]);
                    }/*else if (response.startsWith('Aborted(RuntimeError: unreachable executed)')){
                        console.log('Test');
                        stockfish.terminate();
                        stockfish = new Worker('js/stockfish-16.1-lite-single.js');
                        stockfish.postMessage('uci');
                    }*/

                    //if (save){
                        //ActualizarVar(response);
                    //}

                    ActualizarVar(response);
                }); 

                /*stockfish.onerror = function(error) {
                    console.error("Error en Stockfish:", error);
                };*/
                
                stockfish.postMessage('uci');
                stockfish.postMessage('isready');
                                                                
            }); 
        </script>
